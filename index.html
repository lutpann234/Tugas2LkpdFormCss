<!DOCTYPE html>
<html>
<head>
    <title>Registrasi Akun Belajar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style-belajar.css">
</head>
<body>
    <div class="form-box">
        <h3>Registrasi Akun Belajar</h3>
        <p class="desc">Lengkapi formulir di bawah ini dengan benar</p>

        <label>Nama Lengkap</label>
        <input type="text" placeholder="Masukkan nama lengkap">

        <label>Alamat Email</label>
        <input type="text" placeholder="nama@contoh.com">

        <label>Kata Sandi</label>
        <input type="text" placeholder="Minimal 8 karakter">

        <label>Konfirmasi Kata Sandi</label>
        <input type="text" placeholder="Ulangi kata sandi">

        <label>Status Pengguna</label>
        <select>
            <option>Pilih status</option>
            <option>Pelajar</option>
            <option>Guru</option>
        </select>

        <button type="button" onclick="alert('Pendaftaran Berhasil')">Daftar</button>
    </div>
</body>
</html>
